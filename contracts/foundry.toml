[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fuzz]
runs = 512

[rpc_endpoints]
arc = "${RPC_ARC}"

# Verification: pass CLI flags (explorer.arc.io is Cloudflare-gated from forge).
#   forge verify-contract … --verifier-url https://explorer.arc.io/api \
#     --etherscan-api-key $ARCSCAN_API_KEY --chain 5042
# Or verify in the browser UI.
